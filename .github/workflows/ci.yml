name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ape
          POSTGRES_PASSWORD: ape
          POSTGRES_DB: ape
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ape" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ape:ape@localhost:5432/ape_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ape/config --filter @ape/api-contracts --filter @ape/temporal-workflows build
      # Temporal dev server for the workflow integration tests.
      # Base image for the sandbox isolation tests (they start real containers).
      - run: docker pull node:22-slim
      - name: Start Temporal
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          ~/.temporalio/bin/temporal server start-dev --headless --log-level warn &
          for i in $(seq 1 30); do ~/.temporalio/bin/temporal operator cluster health && break; sleep 1; done
          # The e2e tests run in their own namespace (services/api/test/env.ts).
          ~/.temporalio/bin/temporal operator namespace create --namespace ape-test
      - run: pnpm format:check
      - run: pnpm -r run lint
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - run: pnpm --filter @ape/api test:e2e

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      # The evaluation harness on its scripted reference answers (no model or key needed).
      - run: uv run python -m ai_worker.evaluation run --no-save --min-pass-rate 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the full git history with the gitleaks container (no action license or API needed).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose --exit-code 1
