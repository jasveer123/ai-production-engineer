[project]
name = "ape-agent"
version = "0.1.0"
description = "Send logs, errors and traces from Python apps to AI Production Engineer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Tracing through the OpenTelemetry SDK, exported to the same endpoint.
otel = [
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ape_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
