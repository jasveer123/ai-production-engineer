apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pramaan-collector.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pramaan-collector.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pramaan-collector.name" . }}
        vector.dev/exclude: "true"
    spec:
      serviceAccountName: {{ include "pramaan-collector.name" . }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/pramaan/kubernetes.yaml"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PRAMAAN_INGEST_URL
              value: {{ required "Set ingestUrl" .Values.ingestUrl | quote }}
            - name: PRAMAAN_ENV
              value: {{ .Values.environment | quote }}
            - name: PRAMAAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pramaan-collector.secretName" . }}
                  key: {{ .Values.secretKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlib
              mountPath: /var/lib
              readOnly: true
            - name: data
              mountPath: /var/lib/pramaan-collector
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlib
          hostPath:
            path: /var/lib
        - name: data
          hostPath:
            path: /var/lib/pramaan-collector
            type: DirectoryOrCreate
