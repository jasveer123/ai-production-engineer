name: ape

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ape
      POSTGRES_PASSWORD: ape
      POSTGRES_DB: ape
    ports: ['5434:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ape -d ape']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    user: root
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/data/temporal.db']
    ports: ['7233:7233', '8233:8233']
    volumes: [temporal-data:/data]

  s3:
    image: rustfs/rustfs:latest
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: ape-minio
      RUSTFS_SECRET_KEY: ape-minio-secret
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    ports: ['9000:9000', '9001:9001']
    volumes: [s3-data:/data]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['16686:16686']

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ['4317:4317', '4318:4318']
    depends_on: [jaeger]

volumes:
  postgres-data:
  temporal-data:
  s3-data:
