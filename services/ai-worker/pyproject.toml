[project]
name = "ai-worker"
version = "0.0.1"
description = "AI investigation worker (intelligence plane)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=1.15.0",
    "temporalio>=1.34.0",
    "boto3>=1.43.114",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "google-genai>=2.31.0",
    "openai>=3.35.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "PT", "RUF", "PERF", "N", "ARG", "T20", "PL", "C90"]
ignore = [
  "PLR2004",  # magic numbers and argument counts are judged in review
  "PLR0913",
  "PLR0917",
  "N818",     # public error names are stable and carry a `reason` code
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR", "PLC", "PT018"]
# Wire-format field names (camelCase) shared with the TypeScript side.
"src/ai_worker/fixing.py" = ["N815", "C901", "PLR0912"]  # validate_test: split into checks (backlog)
"src/ai_worker/contracts.py" = ["N815"]
# Command-line output and interface stubs.
"src/ai_worker/evaluation/__main__.py" = ["T201"]
"src/ai_worker/evaluation/providers.py" = ["ARG002", "PLC0415"]  # lazy provider imports
"src/ai_worker/evaluation/scoring.py" = ["C901", "PLR0912", "PLR0915"]  # score(): split by metric (backlog)
"src/ai_worker/llm/gateway.py" = ["ARG002", "PLC0415"]  # NoProvider stub; lazy SDK imports

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
